<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kućni poslovi</title>
<style>
  :root{
    --n-color:#E85D75;
    --s-color:#3B82C4;
    --i-color:#3FB68C;
    --bg:#F6F5F2;
    --card:#FFFFFF;
    --ink:#2B2B2B;
    --muted:#8A8A85;
    --border:#E7E5E0;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:20px;
  }
  .wrap{max-width:1200px;margin:0 auto;}
  header{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
    margin-bottom:20px;
  }
  h1{margin:0;font-size:28px;}
  .date{color:var(--muted);font-size:15px;margin-top:4px;text-transform:capitalize;}
  .reset-btn{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:999px;
    padding:10px 18px;
    font-size:14px;
    cursor:pointer;
    color:var(--ink);
  }
  .reset-btn:hover{background:#efeee9;}
  .lock-btn{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:999px;
    padding:10px 18px;
    font-size:14px;
    cursor:pointer;
    color:var(--ink);
    font-weight:600;
  }
  .lock-btn.locked{
    background:#2B2B2B;
    color:white;
    border-color:#2B2B2B;
  }
  .lock-note{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin:-10px 0 16px;
  }
  .board.locked .assign-row,
  .board.locked .del{
    pointer-events:none;
    opacity:.25;
  }
  .add-panel.locked{
    pointer-events:none;
    opacity:.45;
  }

  .stats{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .stat{
    flex:1 1 150px;
    background:var(--card);
    border-radius:var(--radius);
    padding:14px 16px;
    border:1px solid var(--border);
  }
  .stat .row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .badge{
    width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:white;font-weight:700;font-size:13px;flex-shrink:0;
  }
  .stat .name{font-weight:600;font-size:14px;}
  .stat .frac{margin-left:auto;font-size:13px;color:var(--muted);}
  .bar{height:8px;border-radius:99px;background:#EEEDE8;overflow:hidden;}
  .bar .fill{height:100%;border-radius:99px;transition:width .3s ease;}

  .add-panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:22px;
  }
  .add-row{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .add-row input{
    flex:1;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--border);
    font-size:15px;
  }
  .add-row button{
    background:var(--ink);
    color:white;
    border:none;
    border-radius:12px;
    padding:0 20px;
    font-size:15px;
    cursor:pointer;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-wrap{
    display:flex;
    align-items:stretch;
    border-radius:999px;
    border:1px solid var(--border);
    overflow:hidden;
    background:#F1F0EB;
  }
  .chip{
    background:transparent;
    border:none;
    padding:7px 12px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  .chip:hover{background:#E9E7E0;}
  .chip-all{
    background:#E3E1D9;
    border:none;
    border-left:1px solid var(--border);
    padding:7px 10px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  .chip-all:hover{background:#D8D6CC;}
  .add-row-2{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    font-size:13px;
    color:var(--muted);
  }
  .add-row-2 input[type=checkbox]{
    width:16px;height:16px;
  }

  .board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
  }
  @media(max-width:900px){
    .board{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:560px){
    .board{grid-template-columns:1fr;}
    header{align-items:flex-start;}
  }
  .column{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--border);
    padding:14px;
    min-height:120px;
  }
  .column.pool{background:#FBFAF7;}
  .col-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:12px;
    padding-bottom:10px;
    border-bottom:2px solid var(--border);
  }
  .col-head .badge{width:30px;height:30px;font-size:14px;}
  .col-head .title{font-weight:700;font-size:15px;}
  .col-head .count{margin-left:auto;font-size:12px;color:var(--muted);}

  .task{
    background:#FBFAF8;
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 10px 8px;
    margin-bottom:8px;
  }
  .task.done{opacity:.55;}
  .task-top{
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .task-top input[type=checkbox]{
    width:19px;height:19px;
    margin-top:1px;
    flex-shrink:0;
    accent-color:var(--ink);
  }
  .task-text{
    flex:1;
    font-size:14px;
    line-height:1.35;
  }
  .task.done .task-text{text-decoration:line-through;}
  .del{
    background:none;border:none;color:var(--muted);
    font-size:16px;cursor:pointer;line-height:1;padding:2px 4px;
  }
  .del:hover{color:#c0392b;}
  .assign-row{
    display:flex;
    gap:6px;
    margin-top:8px;
    padding-left:27px;
  }
  .assign-btn{
    width:22px;height:22px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    color:white;
    font-size:11px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    opacity:.45;
  }
  .assign-btn.active{
    opacity:1;
    border-color:var(--ink);
    transform:scale(1.12);
  }
  .assign-btn.unassign{
    background:#D9D7D0;
    color:#6b6b66;
  }
  .empty-hint{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:14px 6px;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:26px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>🏠 Kućni poslovi</h1>
      <div class="date" id="today"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="lock-btn" id="lockBtn" onclick="toggleLock()">🔓 Zaključaj raspored</button>
      <button class="reset-btn" onclick="resetDay()">↺ Resetuj dan (obriši kvačice)</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="add-panel" id="addPanel">
    <div class="add-row">
      <input id="newTaskInput" type="text" placeholder="Upiši novi posao..." onkeydown="if(event.key==='Enter')addTask()">
      <button onclick="addTask()">+ Dodaj</button>
    </div>
    <label class="add-row-2">
      <input type="checkbox" id="assignAllCheck">
      Dodeli odmah svom troje dece (kreira poseban posao za N, S i I)
    </label>
    <div class="chips" id="chips"></div>
  </div>

  <div class="lock-note" id="lockNote" style="display:none;">🔒 Raspored je zaključan — deca i dalje mogu da čekiraju završene poslove, ali dodela i brisanje su onemogućeni dok ne otključaš.</div>

  <div class="board" id="board"></div>

  <footer>Raspored i kvačice se čuvaju u ovom pregledaču (na ovom uređaju/tabletu) dok ih ručno ne promeniš — zatvaranje ili osvežavanje stranice ih ne briše.</footer>
</div>

<script>
const KIDS = [
  {id:'N', color:'var(--n-color)', hex:'#E85D75'},
  {id:'S', color:'var(--s-color)', hex:'#3B82C4'},
  {id:'I', color:'var(--i-color)', hex:'#3FB68C'}
];

const QUICK_CHORES = [
  {icon:'🛏️', text:'Pospremanje kreveta'},
  {icon:'🧹', text:'Usisavanje / čišćenje sobe'},
  {icon:'🗑️', text:'Iznošenje smeća'},
  {icon:'🍽️', text:'Vađenje sudova iz mašine'},
  {icon:'🍽️', text:'Slaganje sudova u mašinu'},
  {icon:'🧺', text:'Slaganje veša'},
  {icon:'🌱', text:'Zalivanje cveća'},
  {icon:'🍎', text:'Postavljanje stola'},
  {icon:'🎒', text:'Spremanje torbe za školu'},
  {icon:'📚', text:'Učenje / čitanje 15 min'},
  {icon:'🧦', text:'Slaganje svojih stvari'},
  {icon:'🧽', text:'Brisanje prašine u sobi'},
  {icon:'🧽', text:'Brisanje prašine prizemlje'},
  {icon:'🧺', text:'Širenje veša'},
  {icon:'🧺', text:'Skupljanje veša'},
  {icon:'🧹', text:'Džogiranje sobe'},
  {icon:'🧹', text:'Usisavanje prizemlja'},
  {icon:'🧽', text:'Brisanje stepeništa'},
  {icon:'🍽️', text:'Raspremanje stola'},
  {icon:'🪞', text:'Brisanje ogledala'},
  {icon:'🚪', text:'Brisanje belih vrata prizemlje'},
  {icon:'🌱', text:'Zalivanje biljaka'},
  {icon:'🧹', text:'Džogiranje terase'},
  {icon:'🛁', text:'Ribanje donjeg kupatila'},
  {icon:'🛁', text:'Ribanje gornjeg kupatila'},
  {icon:'🍞', text:'Prodavnica hleb'},
  {icon:'🪟', text:'Brisanje prozora prizemlje'},
  {icon:'🪟', text:'Brisanje prozora sprat'},
  {icon:'🕸️', text:'Skupljanje paučine'}
];

const STORAGE_KEY = 'kucniPoslovi_v1';

let tasks = [
  {id: id(), icon:'🛏️', text:'Pospremanje kreveta', assignedTo:null, done:false},
  {id: id(), icon:'🗑️', text:'Iznošenje smeća', assignedTo:null, done:false},
  {id: id(), icon:'🍽️', text:'Pranje sudova', assignedTo:null, done:false}
];
let locked = false;

function id(){ return 't' + Math.random().toString(36).slice(2,10); }

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks, locked}));
  }catch(e){ /* ako čuvanje ne uspe, aplikacija i dalje radi u okviru trenutne sesije */ }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      if(Array.isArray(data.tasks)) tasks = data.tasks;
      locked = !!data.locked;
    }
  }catch(e){ /* ignoriši oštećen zapis, koristi podrazumevano stanje */ }
}

function toggleLock(){
  locked = !locked;
  saveState();
  render();
}

function setToday(){
  const dani = ['nedelja','ponedeljak','utorak','sreda','četvrtak','petak','subota'];
  const meseci = ['januar','februar','mart','april','maj','jun','jul','avgust','septembar','oktobar','novembar','decembar'];
  const d = new Date();
  document.getElementById('today').textContent =
    dani[d.getDay()] + ', ' + d.getDate() + '. ' + meseci[d.getMonth()] + ' ' + d.getFullYear() + '.';
}

function addTaskForKids(icon, text, kidIds){
  // kidIds: array of kid ids to create separate tasks for, or [null] for one unassigned task
  kidIds.forEach(kid=>{
    tasks.push({id:id(), icon, text, assignedTo:kid, done:false});
  });
}

function renderChips(){
  const box = document.getElementById('chips');
  box.innerHTML = '';
  QUICK_CHORES.forEach(c=>{
    const wrap = document.createElement('div');
    wrap.className = 'chip-wrap';

    const label = document.createElement('button');
    label.className = 'chip';
    label.textContent = c.icon + ' ' + c.text;
    label.title = 'Dodaj kao nedodeljeno';
    label.onclick = ()=>{
      if(locked) return;
      addTaskForKids(c.icon, c.text, [null]);
      saveState();
      render();
    };

    const allBtn = document.createElement('button');
    allBtn.className = 'chip-all';
    allBtn.textContent = '👥 svima';
    allBtn.title = 'Dodaj svakom detetu posebno';
    allBtn.onclick = ()=>{
      if(locked) return;
      addTaskForKids(c.icon, c.text, KIDS.map(k=>k.id));
      saveState();
      render();
    };

    wrap.appendChild(label);
    wrap.appendChild(allBtn);
    box.appendChild(wrap);
  });
}

function addTask(){
  if(locked) return;
  const input = document.getElementById('newTaskInput');
  const assignAll = document.getElementById('assignAllCheck').checked;
  const val = input.value.trim();
  if(!val) return;
  if(assignAll){
    addTaskForKids('📌', val, KIDS.map(k=>k.id));
  } else {
    addTaskForKids('📌', val, [null]);
  }
  input.value='';
  saveState();
  render();
}

function toggleDone(taskId){
  const t = tasks.find(x=>x.id===taskId);
  if(t) t.done = !t.done;
  saveState();
  render();
}

function assign(taskId, kidId){
  if(locked) return;
  const t = tasks.find(x=>x.id===taskId);
  if(t) t.assignedTo = (t.assignedTo === kidId) ? null : kidId;
  saveState();
  render();
}

function deleteTask(taskId){
  if(locked) return;
  tasks = tasks.filter(x=>x.id!==taskId);
  saveState();
  render();
}

function resetDay(){
  tasks.forEach(t=>t.done=false);
  saveState();
  render();
}

function taskCard(t){
  const div = document.createElement('div');
  div.className = 'task' + (t.done ? ' done' : '');
  const assignBtns = KIDS.map(k=>{
    const active = t.assignedTo===k.id;
    return `<button class="assign-btn ${active?'active':''}" style="background:${k.hex}" title="Dodeli: ${k.id}" onclick="assign('${t.id}','${k.id}')">${k.id}</button>`;
  }).join('') + `<button class="assign-btn unassign" title="Ukloni dodelu" onclick="assign('${t.id}', null)">–</button>`;

  div.innerHTML = `
    <div class="task-top">
      <input type="checkbox" ${t.done?'checked':''} onchange="toggleDone('${t.id}')">
      <div class="task-text">${t.icon} ${escapeHtml(t.text)}</div>
      <button class="del" onclick="deleteTask('${t.id}')">×</button>
    </div>
    <div class="assign-row">${assignBtns}</div>
  `;
  return div;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderStats(){
  const box = document.getElementById('stats');
  box.innerHTML = '';
  KIDS.forEach(k=>{
    const kidTasks = tasks.filter(t=>t.assignedTo===k.id);
    const doneCount = kidTasks.filter(t=>t.done).length;
    const total = kidTasks.length;
    const pct = total ? Math.round(doneCount/total*100) : 0;
    const el = document.createElement('div');
    el.className = 'stat';
    el.innerHTML = `
      <div class="row">
        <div class="badge" style="background:${k.hex}">${k.id}</div>
        <div class="name">${k.id}</div>
        <div class="frac">${doneCount}/${total}</div>
      </div>
      <div class="bar"><div class="fill" style="width:${pct}%;background:${k.hex}"></div></div>
    `;
    box.appendChild(el);
  });
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';

  // pool column
  const pool = document.createElement('div');
  pool.className = 'column pool';
  const poolTasks = tasks.filter(t=>!t.assignedTo);
  pool.innerHTML = `<div class="col-head">
      <div class="badge" style="background:#B9B7B0">–</div>
      <div class="title">Nedodeljeno</div>
      <div class="count">${poolTasks.length}</div>
    </div>`;
  if(poolTasks.length===0){
    const hint = document.createElement('div');
    hint.className='empty-hint';
    hint.textContent = 'Nema nedodeljenih poslova';
    pool.appendChild(hint);
  } else {
    poolTasks.forEach(t=>pool.appendChild(taskCard(t)));
  }
  board.appendChild(pool);

  // kid columns
  KIDS.forEach(k=>{
    const col = document.createElement('div');
    col.className = 'column';
    const kidTasks = tasks.filter(t=>t.assignedTo===k.id);
    col.innerHTML = `<div class="col-head">
        <div class="badge" style="background:${k.hex}">${k.id}</div>
        <div class="title">${k.id}</div>
        <div class="count">${kidTasks.filter(t=>t.done).length}/${kidTasks.length}</div>
      </div>`;
    if(kidTasks.length===0){
      const hint = document.createElement('div');
      hint.className='empty-hint';
      hint.textContent = 'Nema dodeljenih poslova';
      col.appendChild(hint);
    } else {
      kidTasks.forEach(t=>col.appendChild(taskCard(t)));
    }
    board.appendChild(col);
  });
}

function renderLockUI(){
  const btn = document.getElementById('lockBtn');
  const board = document.getElementById('board');
  const addPanel = document.getElementById('addPanel');
  const note = document.getElementById('lockNote');
  btn.textContent = locked ? '🔒 Otključaj raspored' : '🔓 Zaključaj raspored';
  btn.classList.toggle('locked', locked);
  board.classList.toggle('locked', locked);
  addPanel.classList.toggle('locked', locked);
  note.style.display = locked ? 'block' : 'none';
}

function render(){
  renderLockUI();
  renderStats();
  renderBoard();
}

loadState();
setToday();
renderChips();
render();
</script>
</body>
</html>
